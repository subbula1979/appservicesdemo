<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna Foundry Agent</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182230}
body{margin:0;background:#f4f7fb}main{max-width:850px;margin:36px auto;padding:0 16px}
.panel{background:white;border:1px solid #dce3ec;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px #1c355410}
header{padding:20px 24px;background:#123d72;color:white}header h1{margin:0 0 6px;font-size:1.35rem}header p{margin:0;opacity:.9}
#messages{min-height:320px;max-height:55vh;overflow-y:auto;padding:20px}
.msg{padding:12px 14px;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#e7f0ff;margin-left:12%}.assistant{background:#f0f3f7;margin-right:12%}.error{background:#fff0ef;color:#8c2118}
form{border-top:1px solid #e2e8f0;padding:16px;display:flex;gap:10px}
textarea{flex:1;resize:vertical;min-height:48px;max-height:180px;padding:12px;border:1px solid #c8d2df;border-radius:10px;font:inherit}
button{border:0;border-radius:10px;padding:0 18px;background:#1265c7;color:white;font-weight:650;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.toolbar{display:flex;justify-content:flex-end;padding:0 16px 16px}
.toolbar button{padding:10px 14px;background:#e8edf5;color:#26364a}
small{color:#5d6b7d;display:block;padding:0 20px 14px}
</style></head>
<body><main><section class="panel">
<header><h1>Luna Foundry Agent</h1><p>Microsoft Foundry · configured agent version</p></header>
<div id="messages" aria-live="polite"><div class="msg assistant">Hello! Send a message to start chatting with Luna.</div></div>
<form id="chat-form"><textarea id="message" maxlength="10000" placeholder="Message the agent..." required></textarea><button id="send" type="submit">Send</button></form>
<div class="toolbar"><button id="new-chat" type="button">New conversation</button></div>
<small>AI-generated responses may be inaccurate. Do not submit passwords, secrets, or sensitive information.</small>
</section></main>
<script>
const messages=document.getElementById("messages"),form=document.getElementById("chat-form"),input=document.getElementById("message"),send=document.getElementById("send");
function addMessage(text,role,isError=false){const el=document.createElement("div");el.className="msg "+role+(isError?" error":"");el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;}
form.addEventListener("submit",async event=>{event.preventDefault();const message=input.value.trim();if(!message)return;addMessage(message,"user");input.value="";send.disabled=true;try{const response=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Request failed.");addMessage(data.reply||"(No text response returned.)","assistant");}catch(error){addMessage(error.message||"Unexpected error.","assistant",true);}finally{send.disabled=false;input.focus();}});
document.getElementById("new-chat").addEventListener("click",async()=>{try{const response=await fetch("/new-conversation",{method:"POST"});if(!response.ok)throw new Error("Could not start a new conversation.");messages.replaceChildren();addMessage("New conversation started. How can I help?","assistant");}catch(error){addMessage(error.message,"assistant",true);}});
</script></body></html>
